schema_version = "1.4"
multi_step_reward_strategy = "final"

[task]
name = "21st/copy-bench-t67-canvas-boids"
version = "1.0.0"
description = "Copy a moving web page from an 8 s screen recording into one index.html, then check it in a browser and fix it."
authors = [{ name = "21st.dev" }]
keywords = ["copy-bench", "ui-copy", "frontend", "canvas", "video", "two-step"]

[metadata]
copy_bench_id = "t67-canvas-boids"
kind = "canvas"
motion = "timeline"
source = "https://github.com/beneater/boids"

[verifier]
timeout_sec = 600.0
environment_mode = "shared"

[verifier.env]
# The judge key comes from your shell. No key -> ungraded mode (reward 1 if index.html exists).
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
JUDGE_MODEL = "${COPY_BENCH_JUDGE_MODEL:-}"

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai", "api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com", "api.x.ai", "esm.sh", "unpkg.com", "cdn.jsdelivr.net", "cdnjs.cloudflare.com"]

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 2
memory_mb = 4096

# Step 1, one-shot: 30 min, no browser in the sandbox.
[[steps]]
name = "first"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier.env]
CB_STEP = "first"

# Step 2, self-verified: same sandbox, the browser is unpacked by steps/fix/workdir/setup.sh, 20 min.
[[steps]]
name = "fix"

[steps.agent]
timeout_sec = 1200.0

[steps.verifier.env]
CB_STEP = "fix"
